<div class="page-container" id="goals-page">

  <!-- Page Header -->
  <header class="page-header animate-fade-in">
    <div class="page-header-text">
      <h1 class="page-title">Goals & Strategic OKRs</h1>
      <p class="page-description">Define ambitious long-term objectives and track measurable milestone progress.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary btn-sm" id="btn-show-add-goal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;" aria-hidden="true">
          <path d="M5 12h14"/><path d="M12 5v14"/>
        </svg>
        New Objective
      </button>
    </div>
  </header>

  <!-- Summary KPI Strip -->
  <section class="stats-strip animate-fade-in stagger-1" style="grid-template-columns: repeat(3, 1fr); margin-bottom: var(--space-4);" aria-label="Goal Progress Overview">
    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-label">Total Objectives</span>
        <div class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
          </svg>
        </div>
      </div>
      <div class="stat-value tabular-nums" id="stat-total-goals">4</div>
      <div class="stat-delta positive">Active horizons</div>
    </div>

    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-label">Average Progress</span>
        <div class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
          </svg>
        </div>
      </div>
      <div class="stat-value tabular-nums" id="stat-avg-goal-progress">78%</div>
      <div class="stat-delta positive">Across all active OKRs</div>
    </div>

    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-label">High Velocity</span>
        <div class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
      </div>
      <div class="stat-value tabular-nums" id="stat-on-track-goals">3</div>
      <div class="stat-delta positive">>70% completed milestones</div>
    </div>
  </section>

  <!-- Add Goal Panel -->
  <div id="add-goal-panel" class="card animate-fade-in" style="display: none; padding: var(--space-4); margin-bottom: var(--space-4); border-color: var(--color-primary); background: var(--color-bg-card);">
    <div style="font-weight: 600; font-size: var(--font-size-card-title); margin-bottom: var(--space-3); color: var(--color-text-main);">Create Strategic Objective</div>
    <div style="display: flex; gap: var(--space-3); flex-wrap: wrap;">
      <input type="text" id="input-new-goal-title" class="form-input" placeholder="Objective name or milestone..." style="flex: 2; min-width: 220px;" aria-label="Objective name">
      <input type="text" id="input-new-goal-category" class="form-input" placeholder="Domain (Career, Learning, Health)" style="flex: 1; min-width: 140px;" aria-label="Domain">
      <input type="text" id="input-new-goal-date" class="form-input" placeholder="Target (e.g. Q4 2026)" style="flex: 1; min-width: 120px;" aria-label="Target Date">
      <input type="number" id="input-new-goal-progress" class="form-input" placeholder="Progress %" min="0" max="100" value="25" style="width: 110px;" aria-label="Progress percentage">
      <div style="display: flex; gap: var(--space-2);">
        <button class="btn btn-primary" id="btn-submit-new-goal">Add Objective</button>
        <button class="btn btn-secondary" id="btn-cancel-add-goal">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Goals Cards Grid -->
  <div id="goals-list-page-container" class="animate-fade-in stagger-2" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-4);">
    <!-- Dynamically rendered by js/goals.js -->
  </div>

</div>
