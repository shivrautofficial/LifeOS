<div class="page-container" id="notes-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Second Brain & Knowledge Hub</h1>
      <p class="page-description">Capture architectural thoughts, ideas, and cheat sheets completely offline and private.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" id="btn-show-add-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Capture Note
      </button>
    </div>
  </div>

  <!-- Add Note Panel -->
  <div id="add-note-panel" class="card" style="display: none; padding: 16px; margin-bottom: var(--space-lg); background: var(--color-white-surface); border: 1px solid var(--color-electric-indigo);">
    <div style="font-weight: 700; font-size: var(--font-size-sm); margin-bottom: 8px;">Capture to Second Brain</div>
    <div style="display: flex; flex-direction: column; gap: var(--space-sm);">
      <input type="text" id="input-new-note-title" class="form-input" placeholder="Note title...">
      <textarea id="input-new-note-content" class="form-textarea" placeholder="Write thoughts, insights, or architectural notes..."></textarea>
      <input type="text" id="input-new-note-tags" class="form-input" placeholder="Tags (comma separated, e.g. architecture, tech, ideas)">
      <div style="display: flex; gap: var(--space-sm);">
        <button class="btn btn-primary" id="btn-submit-new-note">Save Note</button>
        <button class="btn btn-secondary" id="btn-cancel-add-note">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Notes Grid -->
  <div id="notes-list-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--space-md);">
    <!-- Dynamically rendered -->
  </div>
</div>
