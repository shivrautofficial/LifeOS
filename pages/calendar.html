<script>
  if (!document.getElementById('app-shell')) {
    window.location.replace('../index.html#calendar');
  }
</script>
<div class="page-container" id="calendar-page">

  <!-- Page Header -->
  <header class="page-header animate-fade-in">
    <div class="page-header-text">
      <h1 class="page-title">Calendar & Time Blocking</h1>
      <p class="page-description">Protect deep focus sessions, schedule deliverables, and manage day blocks.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary btn-sm" id="btn-show-add-event">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;" aria-hidden="true">
          <path d="M5 12h14"/><path d="M12 5v14"/>
        </svg>
        Schedule Block
      </button>
    </div>
  </header>

  <!-- Add Event Panel -->
  <div id="add-event-panel" class="card animate-fade-in" style="display: none; padding: var(--space-4); margin-bottom: var(--space-4); border-color: var(--color-primary);">
    <div style="font-weight: 600; font-size: var(--font-size-card-title); margin-bottom: var(--space-3); color: var(--color-text-main);">Schedule Deep Focus Block</div>
    <div style="display: flex; gap: var(--space-3); flex-wrap: wrap;">
      <input type="text" id="input-new-event-title" class="form-input" placeholder="Block title or sprint focus..." style="flex: 2; min-width: 220px;" aria-label="Block title">
      <input type="text" id="input-new-event-time" class="form-input" placeholder="Time (e.g. 09:00 AM - 11:30 AM)" style="flex: 1; min-width: 170px;" aria-label="Block time">
      <input type="text" id="input-new-event-date" class="form-input" placeholder="Date (e.g. Today, Tomorrow)" style="flex: 1; min-width: 130px;" aria-label="Block date">
      <select id="select-new-event-tag" class="form-select" style="flex: 1; min-width: 130px;" aria-label="Block category">
        <option value="Deep Work" selected>Deep Work</option>
        <option value="Review">Review</option>
        <option value="Sprint">Sprint</option>
        <option value="Milestone">Milestone</option>
      </select>
      <div style="display: flex; gap: var(--space-2);">
        <button class="btn btn-primary" id="btn-submit-new-event">Save Block</button>
        <button class="btn btn-secondary" id="btn-cancel-add-event">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Weekly Schedule Grid View -->
  <section class="card animate-fade-in stagger-1" style="padding: var(--space-4);" aria-label="Weekly Timeline Overview">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3); padding-bottom: 8px; border-bottom: 1px solid var(--color-border-subtle);">
      <h2 style="font-size: var(--font-size-card-title); font-weight: 600; color: var(--color-text-main);">7-Day Sprint Horizon</h2>
      <span class="badge badge-indigo">Focus Week</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; overflow-x: auto;" id="calendar-week-strip">
      <!-- Generated by js/calendar.js -->
    </div>
  </section>

  <!-- Scheduled Blocks List -->
  <section class="card animate-fade-in stagger-2" style="padding: var(--space-4);" aria-labelledby="scheduled-blocks-title">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3);">
      <h2 id="scheduled-blocks-title" style="font-size: var(--font-size-card-title); font-weight: 600; color: var(--color-text-main);">Scheduled Commitments</h2>
      <span class="badge badge-neutral" id="calendar-blocks-count">3 active blocks</span>
    </div>

    <div id="calendar-events-container" style="display: flex; flex-direction: column; gap: var(--space-2);">
      <!-- Dynamically rendered by js/calendar.js -->
    </div>
  </section>

</div>
