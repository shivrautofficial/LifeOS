<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS — Productivity & Academic Management MVP</title>
  <meta name="description" content="A local-first starter for the LifeOS project. Includes task management, upcoming agenda, academic tracking, and browser persistence." />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            indigo: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 and Babel for JSX in-browser transpilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const TASK_STORAGE_KEY = "lifeos.tasks.v1";

    function parseLocalDate(dateStr) {
      if (!dateStr) return new Date();
      const [year, month, day] = dateStr.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function formatTaskDate(dateStr) {
      if (!dateStr) return "No deadline";
      return new Intl.DateTimeFormat(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
      }).format(parseLocalDate(dateStr));
    }

    function getDueStatus(task) {
      if (task.completed) return "completed";
      const due = parseLocalDate(task.dueDate);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      due.setHours(0, 0, 0, 0);
      if (due < today) return "overdue";
      if (due.getTime() === today.getTime()) return "today";
      return "upcoming";
    }

    function getIsoDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function createInitialSampleTasks() {
      return [
        {
          id: "sample-1",
          title: "Submit Calculus III Problem Set 4",
          description: "Complete problems 12 to 24 on multiple integrals and Green's Theorem.",
          category: "academic",
          priority: "high",
          dueDate: getIsoDate(-1),
          completed: false,
          createdAt: new Date(Date.now() - 86400000 * 3).toISOString(),
          academicType: "assignment",
          subject: "Mathematics",
        },
        {
          id: "sample-2",
          title: "Physics Lab Report: Optics & Diffraction",
          description: "Analyze interferometer data and include uncertainty propagation tables.",
          category: "academic",
          priority: "medium",
          dueDate: getIsoDate(0),
          completed: false,
          createdAt: new Date(Date.now() - 86400000 * 2).toISOString(),
          academicType: "assignment",
          subject: "Physics",
        },
        {
          id: "sample-3",
          title: "Midterm Exam: Data Structures & Algorithms",
          description: "Review graph traversal, Dijkstra, balanced BSTs, and dynamic programming.",
          category: "academic",
          priority: "high",
          dueDate: getIsoDate(1),
          completed: false,
          createdAt: new Date(Date.now() - 86400000).toISOString(),
          academicType: "exam",
          subject: "Computer Science",
        },
        {
          id: "sample-4",
          title: "LifeOS MVP Team Presentation & Demo",
          description: "Prepare slides, test local persistence, and rehearse presentation flow.",
          category: "academic",
          priority: "high",
          dueDate: getIsoDate(3),
          completed: false,
          createdAt: new Date().toISOString(),
          academicType: "project",
          subject: "Software Engineering",
        },
        {
          id: "sample-5",
          title: "Weekly Grocery & Meal Prep",
          description: "Stock up on fresh fruits, oats, vegetables, and snacks for hackathon week.",
          category: "personal",
          priority: "medium",
          dueDate: getIsoDate(0),
          completed: false,
          createdAt: new Date().toISOString(),
        },
        {
          id: "sample-6",
          title: "Schedule Routine Dental Cleaning",
          description: "Call campus health clinic to confirm appointment slot.",
          category: "personal",
          priority: "low",
          dueDate: getIsoDate(4),
          completed: false,
          createdAt: new Date().toISOString(),
        },
        {
          id: "sample-7",
          title: "Read Chapter 4: Virtual Memory Management",
          description: "Paging, segmentation, and page replacement policies.",
          category: "academic",
          priority: "low",
          dueDate: getIsoDate(-2),
          completed: true,
          createdAt: new Date(Date.now() - 86400000 * 4).toISOString(),
          academicType: "assignment",
          subject: "Computer Science",
        },
      ];
    }

    const fieldClass = "w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100";
    const buttonClass = "rounded-xl px-3 py-2 text-sm font-semibold transition focus:outline-none focus:ring-4 focus:ring-indigo-500/20";

    // TASK MANAGER COMPONENT
    function TaskManager({ tasks, onAdd, onUpdate, onToggle, onDelete, editTaskId, onEditHandled }) {
      const [title, setTitle] = useState("");
      const [description, setDescription] = useState("");
      const [category, setCategory] = useState("academic");
      const [priority, setPriority] = useState("medium");
      const [dueDate, setDueDate] = useState("");
      const [academicType, setAcademicType] = useState("assignment");
      const [subject, setSubject] = useState("");
      const [filter, setFilter] = useState("all");
      const [editingId, setEditingId] = useState(null);
      const [error, setError] = useState("");

      const visibleTasks = useMemo(
        () => tasks
          .filter((task) => filter === "all" || (filter === "active" ? !task.completed : task.completed))
          .sort((a, b) => a.dueDate.localeCompare(b.dueDate)),
        [tasks, filter]
      );

      function resetForm() {
        setTitle(""); setDescription(""); setCategory("academic"); setPriority("medium");
        setDueDate(""); setAcademicType("assignment"); setSubject(""); setEditingId(null); setError("");
      }

      function startEdit(task) {
        setEditingId(task.id); setTitle(task.title); setDescription(task.description || "");
        setCategory(task.category); setPriority(task.priority); setDueDate(task.dueDate);
        setAcademicType(task.academicType || "assignment"); setSubject(task.subject || ""); setError("");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      useEffect(() => {
        if (!editTaskId) return;
        const task = tasks.find((item) => item.id === editTaskId);
        if (!task) return;
        setEditingId(task.id);
        setTitle(task.title);
        setDescription(task.description || "");
        setCategory(task.category);
        setPriority(task.priority);
        setDueDate(task.dueDate);
        setAcademicType(task.academicType || "assignment");
        setSubject(task.subject || "");
        setError("");
        onEditHandled && onEditHandled();
      }, [editTaskId, tasks, onEditHandled]);

      function submit(event) {
        event.preventDefault();
        const cleanTitle = title.trim();
        if (!cleanTitle) { setError("Enter a task title."); return; }
        if (!dueDate) { setError("Choose a deadline."); return; }
        if (category === "academic" && !subject.trim()) { setError("Add a subject for this academic task."); return; }

        const payload = {
          title: cleanTitle,
          description: description.trim() || undefined,
          category,
          priority,
          dueDate,
          academicType: category === "academic" ? academicType : undefined,
          subject: category === "academic" ? subject.trim() : undefined,
        };
        if (editingId) onUpdate(editingId, payload);
        else onAdd(payload);
        resetForm();
      }

      return (
        <section className="space-y-5">
          <div>
            <p className="text-xs font-bold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-400">Productivity</p>
            <h2 className="mt-1 text-2xl font-bold tracking-tight text-slate-950 dark:text-white">Task Manager</h2>
            <p className="mt-1 text-sm text-slate-600 dark:text-slate-400">Capture the work. Set the deadline. Finish what matters.</p>
          </div>

          <form onSubmit={submit} className="grid gap-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-950 sm:p-5">
            <div className="flex items-center justify-between gap-3">
              <h3 className="font-semibold text-slate-900 dark:text-white">{editingId ? "Edit task" : "Create a task"}</h3>
              {editingId && <button type="button" onClick={resetForm} className={`${buttonClass} text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800`}>Cancel edit</button>}
            </div>
            <div className="grid gap-3 sm:grid-cols-2">
              <label className="space-y-1.5 text-sm font-medium text-slate-700 dark:text-slate-300 sm:col-span-2">
                Task title *
                <input className={fieldClass} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Submit calculus assignment" maxLength={140} required />
              </label>
              <label className="space-y-1.5 text-sm font-medium text-slate-700 dark:text-slate-300">
                Category
                <select className={fieldClass} value={category} onChange={(e) => setCategory(e.target.value)}>
                  <option value="academic">Academic</option><option value="personal">Personal</option>
                </select>
              </label>
              <label className="space-y-1.5 text-sm font-medium text-slate-700 dark:text-slate-300">
                Priority
                <select className={fieldClass} value={priority} onChange={(e) => setPriority(e.target.value)}>
                  <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option>
                </select>
              </label>
              <label className="space-y-1.5 text-sm font-medium text-slate-700 dark:text-slate-300">
                Deadline *
                <input className={fieldClass} type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} required />
              </label>
              {category === "academic" && (
                <>
                  <label className="space-y-1.5 text-sm font-medium text-slate-700 dark:text-slate-300">
                    Academic item type
                    <select className={fieldClass} value={academicType} onChange={(e) => setAcademicType(e.target.value)}>
                      <option value="assignment">Assignment</option><option value="project">Project</option><option value="exam">Exam</option><option value="other">Other</option>
                    </select>
                  </label>
                  <label className="space-y-1.5 text-sm font-medium text-slate-700 dark:text-slate-300">
                    Subject / course *
                    <input className={fieldClass} value={subject} onChange={(e) => setSubject(e.target.value)} placeholder="e.g. Engineering Mathematics" maxLength={100} required />
                  </label>
                </>
              )}
              <label className="space-y-1.5 text-sm font-medium text-slate-700 dark:text-slate-300 sm:col-span-2">
                Notes <span className="font-normal text-slate-400">(optional)</span>
                <textarea className={fieldClass} value={description} onChange={(e) => setDescription(e.target.value)} rows={2} maxLength={1000} placeholder="What needs to be done?" />
              </label>
            </div>
            {error && <p role="alert" className="text-sm font-medium text-rose-600">{error}</p>}
            <div><button className={`${buttonClass} bg-indigo-600 text-white hover:bg-indigo-700`} type="submit">{editingId ? "Save changes" : "Add task"}</button></div>
          </form>

          <div className="flex flex-wrap items-center justify-between gap-3">
            <h3 className="font-semibold text-slate-900 dark:text-white">Your tasks <span className="ml-1 text-sm font-normal text-slate-500">({tasks.length})</span></h3>
            <div className="flex gap-1 rounded-xl bg-slate-100 p-1 dark:bg-slate-900" aria-label="Filter tasks">
              {["all", "active", "completed"].map((val) => (
                <button key={val} type="button" onClick={() => setFilter(val)} className={`${buttonClass} capitalize ${filter === val ? "bg-white text-slate-950 shadow-sm dark:bg-slate-700 dark:text-white" : "text-slate-500 hover:text-slate-900 dark:text-slate-400"}`}>{val}</button>
              ))}
            </div>
          </div>

          <div className="space-y-3">
            {visibleTasks.length === 0 ? (
              <div className="rounded-2xl border border-dashed border-slate-300 p-8 text-center dark:border-slate-700">
                <p className="font-semibold text-slate-800 dark:text-slate-200">Nothing here yet</p>
                <p className="mt-1 text-sm text-slate-500">Add a task above to get your plan moving.</p>
              </div>
            ) : (
              visibleTasks.map((task) => {
                const status = getDueStatus(task);
                const priorityClass = task.priority === "high" ? "bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300" : task.priority === "medium" ? "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300" : "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300";
                return (
                  <article key={task.id} className={`rounded-2xl border p-4 transition ${task.completed ? "border-slate-200 bg-slate-50/80 dark:border-slate-800 dark:bg-slate-900/50" : status === "overdue" ? "border-rose-200 bg-rose-50/40 dark:border-rose-900 dark:bg-rose-950/20" : "border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-950"}`}>
                    <div className="flex items-start gap-3">
                      <input aria-label={`Mark ${task.title} complete`} type="checkbox" checked={task.completed} onChange={() => onToggle(task.id)} className="mt-1 h-4 w-4 accent-indigo-600" />
                      <div className="min-w-0 flex-1">
                        <div className="flex flex-wrap items-center gap-2">
                          <h4 className={`font-semibold ${task.completed ? "text-slate-400 line-through" : "text-slate-900 dark:text-white"}`}>{task.title}</h4>
                          <span className={`rounded-full px-2 py-0.5 text-xs font-semibold capitalize ${priorityClass}`}>{task.priority}</span>
                          <span className="rounded-full bg-slate-100 px-2 py-0.5 text-xs capitalize text-slate-600 dark:bg-slate-800 dark:text-slate-300">{task.category}</span>
                        </div>
                        {task.description && <p className="mt-1 whitespace-pre-wrap text-sm text-slate-600 dark:text-slate-400">{task.description}</p>}
                        <p className={`mt-2 text-sm ${status === "overdue" ? "font-semibold text-rose-600 dark:text-rose-400" : status === "today" ? "font-semibold text-amber-700 dark:text-amber-300" : "text-slate-500"}`}>
                          {status === "overdue" ? "Overdue · " : status === "today" ? "Due today · " : status === "completed" ? "Completed · " : "Due · "}{formatTaskDate(task.dueDate)}
                          {task.category === "academic" && task.subject ? ` · ${task.subject}` : ""}
                          {task.category === "academic" && task.academicType ? ` · ${task.academicType}` : ""}
                        </p>
                      </div>
                      <div className="flex shrink-0 flex-col gap-1 sm:flex-row">
                        <button type="button" onClick={() => startEdit(task)} aria-label={`Edit ${task.title}`} className={`${buttonClass} text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800`}>Edit</button>
                        <button type="button" onClick={() => { if (window.confirm(`Delete "${task.title}"?`)) onDelete(task.id); }} aria-label={`Delete ${task.title}`} className={`${buttonClass} text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950`}>Delete</button>
                      </div>
                    </div>
                  </article>
                );
              })
            )}
          </div>
        </section>
      );
    }

    // CALENDAR VIEW COMPONENT
    function CalendarView({ tasks, onToggle }) {
      const [filter, setFilter] = useState("all");

      function dateGroup(task) {
        const status = getDueStatus(task);
        if (status === "overdue") return "Overdue";
        if (status === "today") return "Today";
        const tomorrow = new Date();
        tomorrow.setHours(0, 0, 0, 0);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const due = parseLocalDate(task.dueDate);
        due.setHours(0, 0, 0, 0);
        if (due.getTime() === tomorrow.getTime()) return "Tomorrow";
        return formatTaskDate(task.dueDate);
      }

      const activeEvents = useMemo(() => tasks
        .filter((task) => !task.completed)
        .filter((task) => filter === "all" || task.category === filter)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate)), [tasks, filter]);

      const groups = useMemo(() => {
        const result = new Map();
        for (const task of activeEvents) {
          const label = dateGroup(task);
          const existing = result.get(label) || [];
          existing.push(task);
          result.set(label, existing);
        }
        return [...result.entries()].sort(([a], [b]) => {
          if (a === "Overdue") return -1;
          if (b === "Overdue") return 1;
          if (a === "Today") return -1;
          if (b === "Today") return 1;
          if (a === "Tomorrow") return -1;
          if (b === "Tomorrow") return 1;
          return (result.get(a)?.[0]?.dueDate || "").localeCompare(result.get(b)?.[0]?.dueDate || "");
        });
      }, [activeEvents]);

      return (
        <section className="space-y-5">
          <div>
            <p className="text-xs font-bold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-400">Plan Ahead</p>
            <h2 className="mt-1 text-2xl font-bold tracking-tight text-slate-950 dark:text-white">Upcoming Agenda</h2>
            <p className="mt-1 text-sm text-slate-600 dark:text-slate-400">A simple timeline of deadlines—no complicated calendar controls.</p>
          </div>

          <div className="flex flex-wrap items-center justify-between gap-3">
            <p className="text-sm text-slate-500">{activeEvents.length} open {activeEvents.length === 1 ? "item" : "items"}</p>
            <div className="flex gap-1 rounded-xl bg-slate-100 p-1 dark:bg-slate-900" aria-label="Filter agenda">
              {["all", "academic", "personal"].map((value) => (
                <button key={value} type="button" onClick={() => setFilter(value)} className={`${buttonClass} capitalize ${filter === value ? "bg-white text-slate-950 shadow-sm dark:bg-slate-700 dark:text-white" : "text-slate-500 hover:text-slate-900 dark:text-slate-400"}`}>{value === "all" ? "Everything" : value}</button>
              ))}
            </div>
          </div>

          {groups.length === 0 ? (
            <div className="rounded-2xl border border-dashed border-slate-300 p-8 text-center dark:border-slate-700">
              <p className="font-semibold text-slate-800 dark:text-slate-200">Your agenda is clear</p>
              <p className="mt-1 text-sm text-slate-500">Add a task with a deadline and it will appear here.</p>
            </div>
          ) : (
            <div className="space-y-5">
              {groups.map(([label, items]) => (
                <section key={label} aria-label={label}>
                  <div className="mb-2 flex items-center gap-2">
                    <span className={`h-2 w-2 rounded-full ${label === "Overdue" ? "bg-rose-500" : label === "Today" ? "bg-amber-500" : "bg-indigo-500"}`} />
                    <h3 className={`text-sm font-bold ${label === "Overdue" ? "text-rose-600 dark:text-rose-400" : "text-slate-700 dark:text-slate-200"}`}>{label}</h3>
                    <span className="text-xs text-slate-400">{items.length}</span>
                  </div>
                  <div className="space-y-2 border-l border-slate-200 pl-4 dark:border-slate-800">
                    {items.map((task) => (
                      <article key={task.id} className="rounded-xl border border-slate-200 bg-white p-3 dark:border-slate-800 dark:bg-slate-950">
                        <div className="flex items-start gap-3">
                          <input aria-label={`Mark ${task.title} complete`} type="checkbox" checked={task.completed} onChange={() => onToggle(task.id)} className="mt-1 h-4 w-4 accent-indigo-600" />
                          <div className="min-w-0 flex-1">
                            <p className="font-semibold text-slate-900 dark:text-white">{task.title}</p>
                            <p className="mt-1 text-xs text-slate-500">{formatTaskDate(task.dueDate)} · {task.category === "academic" ? `${task.subject || "Academic"} · ${task.academicType || "task"}` : "Personal"}</p>
                          </div>
                          <span className={`rounded-full px-2 py-1 text-xs font-semibold capitalize ${task.priority === "high" ? "bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300" : task.priority === "medium" ? "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300" : "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300"}`}>{task.priority}</span>
                        </div>
                      </article>
                    ))}
                  </div>
                </section>
              ))}
            </div>
          )}
        </section>
      );
    }

    // ACADEMIC TRACKER COMPONENT
    function AcademicTracker({ tasks, onToggle, onEdit }) {
      const filters = ["all", "assignment", "project", "exam", "other"];
      const [filter, setFilter] = useState("all");
      const academicTasks = useMemo(() => tasks.filter((task) => task.category === "academic"), [tasks]);
      const filteredTasks = useMemo(() => academicTasks
        .filter((task) => filter === "all" || (task.academicType || "other") === filter)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate)), [academicTasks, filter]);

      const completedCount = academicTasks.filter((task) => task.completed).length;
      const progress = academicTasks.length === 0 ? 0 : Math.round((completedCount / academicTasks.length) * 100);
      const overdueCount = academicTasks.filter((task) => getDueStatus(task) === "overdue").length;
      const upcomingExams = academicTasks.filter((task) => !task.completed && task.academicType === "exam").length;

      const subjects = useMemo(() => {
        const result = new Map();
        academicTasks.forEach((task) => {
          const key = (task.subject && task.subject.trim()) || "Uncategorized";
          const entry = result.get(key) || { total: 0, done: 0 };
          entry.total += 1;
          if (task.completed) entry.done += 1;
          result.set(key, entry);
        });
        return [...result.entries()].sort(([a], [b]) => a.localeCompare(b));
      }, [academicTasks]);

      return (
        <section className="space-y-5">
          <div>
            <p className="text-xs font-bold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-400">Study Centre</p>
            <h2 className="mt-1 text-2xl font-bold tracking-tight text-slate-950 dark:text-white">Academic Tracker</h2>
            <p className="mt-1 text-sm text-slate-600 dark:text-slate-400">Keep assignments, projects and exams in one place.</p>
          </div>

          <div className="grid gap-3 sm:grid-cols-3">
            <div className="rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-950">
              <p className="text-sm font-medium text-slate-500">Completion</p>
              <p className="mt-2 text-3xl font-bold tracking-tight text-slate-950 dark:text-white">{progress}%</p>
              <p className="mt-1 text-xs text-slate-500">{completedCount} of {academicTasks.length} complete</p>
            </div>

          <div className="rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-950 sm:p-5">

                  return (
                    <div key={subject}>
                      <div className="mb-1.5 flex items-center justify-between gap-3 text-sm">
                        <span className="truncate text-slate-700 dark:text-slate-300">{subject}</span>

                      <div className="h-1.5 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800">

                    </div>

          </div>

          <div className="flex flex-wrap items-center justify-between gap-3">
            <h3 className="font-semibold text-slate-900 dark:text-white">Academic Deadlines <span className="ml-1 text-sm font-normal text-slate-500">({academicTasks.length})</span></h3>

          {filteredTasks.length === 0 ? (

              {filteredTasks.map((task) => {
                const status = getDueStatus(task);

                    <div className="flex items-start gap-3">

                      </div>
                      <button type="button" onClick={() => onEdit(task)} className="rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Edit</button>
                    </div>
                  </article>
                );
              })}
            </div>
          )}
        </section>
      );
    }

    // MAIN LIFEOS APP
    function LifeOSApp() {
      const [tasks, setTasks] = useState([]);
      const [isLoaded, setIsLoaded] = useState(false);
      const [activeTab, setActiveTab] = useState("overview");
      const [editingTaskId, setEditingTaskId] = useState(null);
      const [isDarkMode, setIsDarkMode] = useState(false);

      // Hydrate from localStorage
      useEffect(() => {
        try {
          const raw = window.localStorage.getItem(TASK_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setTasks(parsed);
              setIsLoaded(true);
              return;
            }
          }
          const samples = createInitialSampleTasks();
          setTasks(samples);
          window.localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(samples));
        } catch (e) {
          console.error("Storage error:", e);
          const samples = createInitialSampleTasks();
          setTasks(samples);
        } finally {
          setIsLoaded(true);
        }
      }, []);

      const saveTasks = (newTasks) => {
        setTasks(newTasks);
        try {
          window.localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(newTasks));
        } catch (e) {
          console.error("Save error:", e);
        }
      };

      const addTask = (input) => {
        const newTask = {
          ...input,
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
          createdAt: new Date().toISOString(),
          completed: false,
        };
        saveTasks([newTask, ...tasks]);
      };

      const updateTask = (id, updates) => {
        saveTasks(tasks.map((t) => (t.id === id ? { ...t, ...updates } : t)));
      };

      const toggleTask = (id) => {
        saveTasks(tasks.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t)));
      };

      const deleteTask = (id) => {
        saveTasks(tasks.filter((t) => t.id !== id));
      };

      const resetSampleData = () => {
        const samples = createInitialSampleTasks();
        saveTasks(samples);
      };

      const exportJSON = () => {
        try {
          const dataStr = JSON.stringify(tasks, null, 2);
          const blob = new Blob([dataStr], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `lifeos-tasks-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          alert("Export error: " + e.message);
        }
      };

      const toggleDarkMode = () => {
        setIsDarkMode((prev) => {
          const next = !prev;
          if (next) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
          return next;
        });
      };

      const handleEditFromAcademic = (task) => {
        setEditingTaskId(task.id);
        setActiveTab("tasks");
      };

      // Metrics calculation
      const metrics = useMemo(() => {
        const total = tasks.length;
        const completed = tasks.filter((t) => t.completed).length;
        const open = total - completed;
        const overdue = tasks.filter((t) => !t.completed && getDueStatus(t) === "overdue").length;
        const today = tasks.filter((t) => !t.completed && getDueStatus(t) === "today").length;
        const academic = tasks.filter((t) => t.category === "academic");
        const academicCompleted = academic.filter((t) => t.completed).length;
        const exams = academic.filter((t) => !t.completed && t.academicType === "exam").length;
        const rate = total > 0 ? Math.round((completed / total) * 100) : 0;
        return { total, completed, open, overdue, today, academicCount: academic.length, academicCompleted, exams, rate };
      }, [tasks]);

      const recentUpcoming = useMemo(() => {
        return tasks
          .filter((t) => !t.completed)
          .sort((a, b) => a.dueDate.localeCompare(b.dueDate))
          .slice(0, 5);
      }, [tasks]);

      if (!isLoaded) {
        return (
          <div className="flex min-h-screen items-center justify-center bg-slate-50 dark:bg-slate-950">
            <div className="text-center">
              <div className="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-indigo-600 border-t-transparent" />
              <p className="mt-4 text-sm font-medium text-slate-600 dark:text-slate-400">Loading LifeOS...</p>
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen bg-slate-50 transition-colors duration-200 dark:bg-slate-950 text-slate-900 dark:text-slate-100 ${isDarkMode ? "dark" : ""}`}>

          <header className="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/90">

                      MVP
                    </span>
                  </div>
                  <p className="hidden text-xs text-slate-500 dark:text-slate-400 sm:block">
                    Productivity & Academic Management
                  </p>

              </div>

                    activeTab === "overview"
                      ? "bg-white text-slate-950 shadow-sm dark:bg-slate-700 dark:text-white"
                      : "text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"
                  }`}
                >
                  Overview
                </button>
                <button

                      ? "bg-white text-slate-950 shadow-sm dark:bg-slate-700 dark:text-white"
                      : "text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"
                  }`}
                >
                  Tasks
                  {metrics.open > 0 && (
                    <span className="ml-1.5 rounded-full bg-indigo-100 px-1.5 py-0.2 text-[10px] font-bold text-indigo-700 dark:bg-indigo-900 dark:text-indigo-200">
                      {metrics.open}
                    </span>
                  )}
                </button>
                <button
                  onClick={() => setActiveTab("calendar")}

                    activeTab === "calendar"
                      ? "bg-white text-slate-950 shadow-sm dark:bg-slate-700 dark:text-white"
                      : "text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"
                  }`}
                >
                  Agenda
                  {metrics.overdue > 0 && (
                    <span className="ml-1.5 rounded-full bg-rose-100 px-1.5 py-0.2 text-[10px] font-bold text-rose-700 dark:bg-rose-950 dark:text-rose-300">
                      {metrics.overdue}
                    </span>
                  )}
                </button>
                <button
                  onClick={() => setActiveTab("academic")}
                  className={`relative rounded-lg px-3 py-1.5 text-xs font-semibold transition ${
                    activeTab === "academic"
                      ? "bg-white text-slate-950 shadow-sm dark:bg-slate-700 dark:text-white"
                      : "text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"
                  }`}
                >
                  Academic
                  {metrics.exams > 0 && (
                    <span className="ml-1.5 rounded-full bg-amber-100 px-1.5 py-0.2 text-[10px] font-bold text-amber-800 dark:bg-amber-950 dark:text-amber-300">
                      {metrics.exams}
                    </span>
                  )}
                </button>
              </nav>

              {/* Header Right */}
              <div className="flex items-center gap-2">
                <button

                >
                  Export JSON

                <button
                  onClick={toggleDarkMode}

                >
                  {isDarkMode ? "☀️" : "🌙"}
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="mx-auto max-w-6xl px-4 py-8 sm:px-6">
            {activeTab === "overview" && (
              <div className="space-y-6">
                {/* Hero / Welcome */}
                <div className="rounded-3xl border border-indigo-100 bg-gradient-to-r from-indigo-50/70 via-white to-purple-50/50 p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900/60 dark:from-slate-900 dark:to-slate-900">
                  <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-widest text-indigo-600 dark:text-indigo-400">
                        Productivity Dashboard
                      </span>
                      <h1 className="mt-1 text-3xl font-extrabold tracking-tight text-slate-950 dark:text-white">
                        Welcome to LifeOS

                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        onClick={() => setActiveTab("tasks")}

                      >

                      </button>
                      <button
                        onClick={resetSampleData}
                        className="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"
                      >
                        Reset Demo Data
                      </button>
                    </div>

                    </div>
                    <div className="mt-3 h-2 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800">
                      <div className="h-full bg-indigo-600 transition-all duration-500" style={{ width: `${metrics.rate}%` }} />

                  <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">

                        {metrics.overdue}

                      <span className="text-xs text-slate-500">Needs prompt action</span>
                    </div>
                    <p className="mt-3 text-xs text-slate-500">
                      {metrics.overdue > 0 ? "Resolve past-due items in Agenda" : "No overdue tasks right now!"}

                  <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">

                    <div className="mt-2 flex items-baseline justify-between">
                      <p className="text-3xl font-bold tracking-tight text-amber-600 dark:text-amber-400">
                        {metrics.today}
                      </p>
                      <span className="text-xs text-slate-500">Active deadlines</span>

                    <div className="mt-2 flex items-baseline justify-between">

                            >
                              <div className="flex items-center gap-3 min-w-0">
                                <input
                                  type="checkbox"
                                  checked={task.completed}
                                  onChange={() => toggleTask(task.id)}

                                />
                                <div className="min-w-0">
                                  <p className="truncate text-sm font-semibold text-slate-900 dark:text-white">
                                    {task.title}

                                  <p className="text-xs text-slate-500">
                                    {formatTaskDate(task.dueDate)} · {task.category === "academic" ? task.subject || "Academic" : "Personal"}
                                  </p>
                                </div>
                              </div>
                              <span
                                className={`shrink-0 rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider ${

                  onEditHandled={() => setEditingTaskId(null)}
                />
              </div>
            )}

            {activeTab === "calendar" && (
              <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
                <CalendarView tasks={tasks} onToggle={toggleTask} />
              </div>
            )}

            {activeTab === "academic" && (
              <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
                <AcademicTracker
                  tasks={tasks}
                  onToggle={toggleTask}
                  onEdit={handleEditFromAcademic}
                />
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<LifeOSApp />);
  </script>
</body>
</html>
